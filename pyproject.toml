[project]
name = "kotlownia2"
version = "0.1.0"
description = "Sterownik kotłowni dla Raspberry Pi"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["controller", "api", "tests"]
